name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # tsconfig.json typechecks src and tests. tsconfig.sim.json typechecks,
      # with no DOM lib, everything that runs in Nakama's JS runtime: src/sim,
      # src/config, src/server, src/net/protocol.ts and src/net/simVersion.ts.
      # Any error in either project fails CI. `npm run typecheck` runs both, so
      # CI and local checks stay the same command.
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npx vite build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
