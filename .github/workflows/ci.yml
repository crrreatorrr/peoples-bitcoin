name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # tsconfig.json typechecks src and tests. Any error there fails CI,
      # including tests/. The sim project has no DOM lib; tests pull hub code
      # into it, so only src/sim and src/config errors fail that pass.
      - name: Typecheck
        run: |
          npx tsc -p tsconfig.json --pretty false --noEmit
          set +e
          npx tsc -p tsconfig.sim.json --pretty false --noEmit > tsc-sim.txt 2>&1
          set -e
          if grep -E '^src/(sim|config)/' tsc-sim.txt; then
            echo "Type errors in the sim"
            cat tsc-sim.txt
            exit 1
          fi
      - name: Build
        run: npx vite build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
